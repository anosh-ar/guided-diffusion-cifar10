[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-diffusion-cifar10"
version = "1.0.0"
description = "Class-conditional DDPM with classifier-free guidance on CIFAR-10"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ahmad Anosh Rezaei" }]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "einops>=0.6",
    "numpy",
    "tqdm",
    "matplotlib",
    "torchmetrics[image]>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["ddpm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
